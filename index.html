<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PainShop — Joyería</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0d0f;
  color: #f1f1f1;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 24px 6%;
  border-bottom: 1px solid #242428;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo span {
  color: #888;
  font-weight: 400;
}

.search {
  width: 320px;
  max-width: 100%;
  background: #17171a;
  border: 1px solid #2c2c31;
  border-radius: 10px;
  padding: 12px 15px;
  color: white;
  outline: none;
}

main {
  width: 88%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 45px 0;
}

.intro {
  margin-bottom: 35px;
}

.intro h1 {
  font-size: 38px;
  margin: 0 0 10px;
}

.intro p {
  color: #999;
  margin: 0;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 30px;
}

.category-btn {
  background: #17171a;
  border: 1px solid #2c2c31;
  color: #aaa;
  padding: 9px 15px;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
}

.category-btn:hover,
.category-btn.active {
  background: #f1f1f1;
  color: #111;
  border-color: #f1f1f1;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

.results {
  color: #777;
  font-size: 14px;
}

.sort {
  background: #17171a;
  border: 1px solid #2c2c31;
  color: #ddd;
  padding: 10px;
  border-radius: 8px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 18px;
}

.card {
  background: #141417;
  border: 1px solid #242428;
  border-radius: 14px;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #3b3b40;
}

/* GALLERY */

.gallery {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #101012;
  overflow: hidden;
}

.gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
}

.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.55);
  color: white;
  cursor: pointer;
  z-index: 3;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
}

.gallery:hover .gallery-arrow {
  opacity: 1;
}

.gallery-arrow:hover {
  background: rgba(255,255,255,0.18);
}

.gallery-arrow.left {
  left: 10px;
}

.gallery-arrow.right {
  right: 10px;
}

.gallery-count {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 999px;
  z-index: 3;
}

.no-photo {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 13px;
}

.card-content {
  padding: 17px;
}

.card-title {
  font-size: 17px;
  margin-bottom: 8px;
}

.card-code {
  color: #666;
  font-size: 12px;
  margin-bottom: 12px;
}

.info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
}

.info-label {
  color: #666;
}

.info-value {
  color: #bbb;
  text-align: right;
}

.price {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.stock {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  width: fit-content;
  margin-top: 10px;
  padding: 6px 10px;
  border: 1px solid #303036;
  border-radius: 999px;
  background: #151518;
  font-size: 11px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: .15px;
}

.stock-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 12%, transparent);
}

.stock-disponible { color: #d7f5dc !important; border-color: #29452f; background: #111913; }
.stock-consultar { color: #e5d8b8 !important; border-color: #4a402c; background: #191711; }
.stock-agotado { color: #888 !important; border-color: #303036; background: #141417; }
.stock-unknown { color: #aaa !important; }
.card.stock-agotado-card { opacity: .62; }
.card.stock-agotado-card .gallery { filter: grayscale(.35); }
.order-btn.order-btn-disabled { background: #252529; color: #777; cursor: not-allowed; border: 1px solid #303036; }
.order-btn.order-btn-disabled:hover { background: #252529; }

.order-btn {
  width: 100%;
  margin-top: 15px;
  padding: 11px;
  border-radius: 8px;
  border: none;
  background: #f1f1f1;
  color: #111;
  font-weight: 600;
  cursor: pointer;
}

.order-btn:hover {
  background: #ddd;
}

.empty {
  color: #777;
  padding: 50px 0;
  text-align: center;
}

footer {
  margin-top: 60px;
  padding: 40px 6%;
  border-top: 1px solid #242428;
  color: #777;
  line-height: 1.7;
}

footer strong {
  color: #ddd;
}

/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.lightbox.active {
  display: flex;
}

.lightbox-content {
  position: relative;
  width: min(1000px, 95vw);
  height: min(90vh, 900px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-image {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  user-select: none;
}

.lightbox-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid #444;
  background: #17171a;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid #444;
  background: rgba(20,20,23,0.9);
  color: white;
  cursor: pointer;
  font-size: 25px;
}

.lightbox-arrow.left {
  left: 0;
}

.lightbox-arrow.right {
  right: 0;
}

.lightbox-count {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  color: #aaa;
  font-size: 13px;
}


/* PRODUCT MODAL */
.product-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.product-modal.active{display:flex}
.product-modal-box{position:relative;width:min(1050px,96vw);max-height:92vh;overflow:auto;background:#141417;border:1px solid #303036;border-radius:18px;display:grid;grid-template-columns:1.05fr .95fr;box-shadow:0 25px 80px rgba(0,0,0,.55)}
.product-modal-gallery{position:relative;min-height:560px;background:#0c0c0e;overflow:hidden}
.product-modal-gallery>img{width:100%;height:100%;min-height:560px;object-fit:contain;display:block;user-select:none}
.product-modal-thumbs{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px;overflow-x:auto;padding:3px}
.product-modal-thumb{flex:0 0 58px;width:58px;height:58px;border:1px solid #3b3b40;border-radius:8px;overflow:hidden;background:#17171a;padding:0;cursor:pointer;opacity:.65}
.product-modal-thumb.active{opacity:1;border-color:#f1f1f1}
.product-modal-thumb img{width:100%!important;height:100%!important;min-height:0!important;object-fit:cover!important}
.product-modal-info{padding:42px 38px 35px;display:flex;flex-direction:column}
.product-modal-close{position:absolute;top:13px;right:13px;z-index:10002;width:40px;height:40px;border-radius:50%;border:1px solid #3b3b40;background:rgba(20,20,23,.94);color:#fff;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box}
.product-modal-category{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.product-modal-title{font-size:30px;line-height:1.15;margin:0 0 7px}
.product-modal-code{color:#666;font-size:13px;margin-bottom:25px}
.product-modal-description{color:#999;line-height:1.6;font-size:14px;margin:0 0 25px}
.product-modal-specs{border-top:1px solid #29292e;border-bottom:1px solid #29292e;padding:15px 0;display:flex;flex-direction:column;gap:11px}
.product-modal-spec{display:flex;justify-content:space-between;gap:20px;font-size:14px}
.product-modal-spec-label{color:#666}.product-modal-spec-value{color:#ddd;text-align:right}
.product-modal-bottom{margin-top:auto;padding-top:25px}
.product-modal-price{font-size:28px;font-weight:700;margin-bottom:7px}
.product-modal-stock{font-size:13px;margin-bottom:17px}
.product-modal-order{width:100%;padding:14px;border:0;border-radius:9px;background:#f1f1f1;color:#111;font-weight:700;cursor:pointer;font-size:14px}
.product-modal-order:hover{background:#ddd}
.product-modal-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:#fff;font-size:25px;cursor:pointer}
.product-modal-arrow.left{left:13px}.product-modal-arrow.right{right:13px}
.product-modal-count{position:absolute;top:15px;left:15px;z-index:4;background:rgba(0,0,0,.62);border-radius:999px;padding:6px 9px;font-size:12px}
@media(max-width:760px){
.product-modal{padding:0;align-items:flex-end;min-height:100dvh}
.product-modal-box{width:100%;height:min(94dvh,900px);max-height:94dvh;border-radius:18px 18px 0 0;grid-template-columns:1fr;overflow-y:auto;overscroll-behavior:contain;padding-top:0}
.product-modal-close{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:10003;width:42px;height:42px}
.product-modal-gallery{min-height:55vh;max-height:55vh}
.product-modal-gallery>img{min-height:55vh;max-height:55vh}
.product-modal-info{padding:25px 20px}
.product-modal-title{font-size:25px}
.product-modal-bottom{margin-top:20px}
}

@media (max-width: 600px) {

  header {
    flex-direction: column;
    align-items: stretch;
  }

  .search {
    width: 100%;
  }

  main {
    width: 92%;
    padding-top: 30px;
  }

  .intro h1 {
    font-size: 30px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .card-content {
    padding: 12px;
  }

  .card-title {
    font-size: 15px;
  }

  .info-row {
    font-size: 11px;
  }

  .price {
    font-size: 17px;
  }

  .gallery-arrow {
    opacity: 1;
    width: 30px;
    height: 30px;
    font-size: 17px;
  }

  .lightbox {
    padding: 10px;
  }

  .lightbox-image {
    max-width: 95%;
    max-height: 80%;
  }

  .lightbox-arrow {
    width: 38px;
    height: 38px;
    font-size: 20px;
  }
}

/* =========================
   FILTERS
========================= */

.filter-bar {
  margin: 18px 0 10px;
}

.filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #111;
  color: #eee;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
}

.filter-toggle:hover {
  border-color: #666;
}

.filter-count {
  display: none;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 20px;
  background: #eee;
  color: #111;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
}

.filters-panel {
  display: none;
  margin-top: 10px;
  padding: 14px;
  border: 1px solid #292929;
  border-radius: 10px;
  background: #0d0d0d;
}

.filters-panel.active {
  display: block;
}

.filters-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(130px, 1fr));
  gap: 10px;
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.filter-group label {
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.filter-select {
  width: 100%;
  background: #151515;
  color: #eee;
  border: 1px solid #333;
  border-radius: 7px;
  padding: 9px 10px;
  font-size: 13px;
  outline: none;
}

.filter-select:focus {
  border-color: #777;
}

.filters-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
}

.clear-filters {
  background: transparent;
  color: #aaa;
  border: 0;
  padding: 6px 0;
  cursor: pointer;
  font-size: 12px;
}

.clear-filters:hover {
  color: #fff;
}

.active-filter-note {
  color: #777;
  font-size: 11px;
}

@media (max-width: 900px) {
  .filters-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  .filters-grid {
    grid-template-columns: 1fr 1fr;
  }

  .filter-toggle {
    width: 100%;
    justify-content: center;
  }

  .filters-footer {
    flex-direction: column;
    align-items: flex-start;
  }
}


/* =========================
   FAVORITES + FINAL POLISH
========================= */
.filter-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.favorite-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:#111;
  color:#eee;
  border:1px solid #333;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:13px;
  transition:border-color .2s,background .2s,color .2s;
}
.favorite-toggle:hover{border-color:#666}
.favorite-toggle.active{background:#eee;color:#111;border-color:#eee}
.favorite-count{
  min-width:18px;height:18px;padding:0 5px;border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#2a2a2e;color:#eee;font-size:11px;
}
.favorite-toggle.active .favorite-count{background:#111;color:#eee}
.favorite-button{
  position:absolute;top:11px;right:11px;z-index:5;
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(10,10,12,.72);backdrop-filter:blur(6px);
  color:#fff;font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .18s,background .18s,border-color .18s;
}
.favorite-button:hover{transform:scale(1.06);background:rgba(255,255,255,.12)}
.favorite-button.active{color:#fff;background:rgba(255,255,255,.16);border-color:#666}
.favorite-button.active::first-letter{color:#fff}
.card.favorite-card{border-color:#3b3b40}
.product-modal-favorite{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:9px;padding:11px;border-radius:9px;
  border:1px solid #303036;background:#17171a;color:#ddd;
  font-weight:600;cursor:pointer;font-size:13px;
}
.product-modal-favorite:hover{background:#202024}
.product-modal-favorite.active{background:#eee;color:#111;border-color:#eee}
.filters-footer{gap:14px}
@media(max-width:600px){
  .filter-actions{width:100%;}
  .favorite-toggle,.filter-toggle{flex:1;min-width:0;}
  .favorite-button{width:34px;height:34px;top:8px;right:8px;font-size:18px}
}

/* =========================
   PAINSHOP FINAL HEADER / FOOTER
========================= */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(13,13,15,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #242428;
}
.header-inner{
  width:88%;
  max-width:1400px;
  min-height:76px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}
.site-header .logo{
  color:#f1f1f1;
  text-decoration:none;
  font-size:23px;
  font-weight:700;
  letter-spacing:1.2px;
}
.main-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
}
.nav-link{
  position:relative;
  color:#8e8e94;
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12px;
  padding:29px 8px 27px;
  transition:color .2s;
}
.nav-link:hover,.nav-link.active{color:#f1f1f1}
.nav-link.active::after{
  content:"";
  position:absolute;
  left:8px;
  right:8px;
  bottom:19px;
  height:1px;
  background:#f1f1f1;
}
.catalog-search{
  margin:-3px 0 32px;
}
.search-wrap{
  position:relative;
  max-width:620px;
}
.search-wrap .search{
  width:100%;
  height:48px;
  padding:0 17px 0 45px;
  border-radius:3px;
  background:#121215;
  border-color:#303036;
  font-size:14px;
}
.search-wrap .search:focus{border-color:#666;box-shadow:0 0 0 3px rgba(255,255,255,.035)}
.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  fill:none;
  stroke:#777;
  stroke-width:1.6;
  pointer-events:none;
  z-index:2;
}
.intro{
  margin-bottom:30px;
  padding-top:8px;
}
.intro-eyebrow{
  color:#66666d;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:10px;
  margin-bottom:12px;
}
.intro h1{
  font-size:42px;
  font-weight:500;
  letter-spacing:-.025em;
  margin:0 0 9px;
}
.intro p{font-size:14px;color:#888;margin:0}
.site-footer{
  margin-top:80px;
  padding:42px 6%;
  border-top:1px solid #242428;
  color:#777;
}
.footer-inner{
  width:88%;
  max-width:1400px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:30px;
  align-items:start;
}
.footer-brand{display:flex;flex-direction:column;gap:5px}
.footer-brand strong{color:#ddd;font-size:18px;letter-spacing:.05em}
.footer-brand span{font-size:12px;color:#666}
.footer-contact{font-size:12px;line-height:1.9}
.footer-contact a{color:#aaa;text-decoration:none}
.footer-contact a:hover{color:#fff}
.footer-socials{display:flex;flex-direction:column;gap:12px;justify-self:end}
.social-link{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:#999;
  text-decoration:none;
  font-size:12px;
  transition:color .2s;
}
.social-link:hover{color:#fff}
.social-link svg{
  width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
}
@media(max-width:600px){
  .header-inner{width:92%;min-height:64px;justify-content:center}
  .site-header .logo{font-size:20px;position:absolute;left:4%}
  .main-nav{justify-content:center}
  .nav-link{padding:24px 7px 22px;font-size:10px}
  .nav-link.active::after{bottom:16px}
  main{width:92%;padding-top:32px}
  .intro{padding-top:0;margin-bottom:24px}
  .intro h1{font-size:30px}
  .catalog-search{margin-bottom:25px}
  .search-wrap .search{height:46px}
  .site-footer{padding:35px 4%}
  .footer-inner{width:92%;grid-template-columns:1fr;gap:22px}
  .footer-socials{justify-self:start}
}

</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#catalogo" aria-label="PainShop inicio">PainShop</a>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzmvI1adtX-AmCKToQl-nB5r2Irs48BbMGk2VMvQbb1zq2VwyuNlL6_hmJD7xQsNn2u/exec";


let catalog = {};
let allProducts = [];
let currentCategory = "Todas";

let activeFilters = {
  category: "",
  type: "",
  material: "",
  color: "",
  gauge: "",
  stock: ""
};

let favoriteIds = new Set();
let showingFavorites = false;

try {
  favoriteIds = new Set(JSON.parse(localStorage.getItem("painshopFavorites") || "[]"));
} catch (error) {
  favoriteIds = new Set();
}

let lightboxPhotos = [];
let lightboxIndex = 0;


/* =========================
   GOOGLE DRIVE PHOTOS
========================= */

function convertPhotoUrl(url) {

  if (!url) {
    return null;
  }

  const driveMatch =
    String(url).match(
      /drive\.google\.com\/file\/d\/([^/]+)/
    );

  if (driveMatch) {

    const fileId = driveMatch[1];

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(fileId) +
      "&sz=w1200"
    );
  }

  return String(url).trim();
}


function getPhotos(product) {

  const value = product["Fotos"];

  if (!value) {
    return [];
  }

  return String(value)
    .split(",")
    .map(x => x.trim())
    .filter(Boolean)
    .map(convertPhotoUrl)
    .filter(Boolean);
}


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function normalizePrice(value) {

  if (value === null || value === undefined) {
    return 0;
  }

  const cleaned =
    String(value)
      .replace("$", "")
      .replace(",", ".")
      .trim();

  const number = parseFloat(cleaned);

  return isNaN(number) ? 0 : number;
}


function displayPrice(value) {

  const number = normalizePrice(value);

  if (!number) {
    return "";
  }

  return "$" + number;
}


function getStockClass(stock) {
  const value = String(stock || "").toLowerCase().trim();
  if (value.includes("disponible")) return "stock-disponible";
  if (value.includes("consultar")) return "stock-consultar";
  if (value.includes("agotado")) return "stock-agotado";
  return "stock-unknown";
}

function isStockSoldOut(stock) {
  return String(stock || "").toLowerCase().includes("agotado");
}

function getStockLabel(stock) {
  const value = String(stock || "").trim();
  return value || "Consultar";
}


/* =========================
   LOAD CATALOG
========================= */

function loadCatalog() {

  const callbackName =
    "painshopCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  const timeout =
    setTimeout(() => {

      script.remove();

      showError();

    }, 10000);


  window[callbackName] = function(data) {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    catalog = data || {};

    prepareProducts();

  };


  script.onerror = function() {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    showError();

  };


  script.src =
    API_URL +
    "?callback=" +
    callbackName +
    "&_=" +
    Date.now();

  document.body.appendChild(script);
}


function showError() {

  document.getElementById("products").innerHTML =
    `<div class="empty">
      No se pudo cargar el catálogo.
      <br>
      Intenta actualizar la página.
    </div>`;
}


/* =========================
   PREPARE PRODUCTS
========================= */

function prepareProducts() {

  allProducts = [];

  Object.keys(catalog).forEach(category => {

    const products =
      Array.isArray(catalog[category])
        ? catalog[category]
        : [];

    products.forEach(product => {

      product.__category = category;

      allProducts.push(product);

    });

  });

  renderCategories();

  updateFilterUI();

  renderProducts();

}


/* =========================
   CATEGORIES
========================= */

function renderCategories() {

  const container =
    document.getElementById("categories");

  container.innerHTML = "";

  const categories =
    Object.keys(catalog)
      .filter(category =>
        Array.isArray(catalog[category]) &&
        catalog[category].length > 0
      );


  const allButton =
    document.createElement("button");

  allButton.className =
    "category-btn active";

  allButton.textContent =
    "Todas";

  allButton.onclick = () => {

    syncCategory("Todas");

  };

  container.appendChild(allButton);


  categories.forEach(category => {

    const button =
      document.createElement("button");

    button.className =
      "category-btn";

    button.textContent =
      category;

    button.onclick = () => {

      syncCategory(category);

    };

    container.appendChild(button);

  });

}


function updateActiveCategory() {

  document
    .querySelectorAll(".category-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.textContent === currentCategory
      );

    });

}


/* =========================
   FILTER + SORT
========================= */


function splitFilterValues(value) {
  if (value === null || value === undefined || String(value).trim() === "") {
    return [];
  }

  return String(value)
    .split(",")
    .map(value => value.trim())
    .filter(Boolean);
}


function normalizeFilterValue(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}


function productMatchesFilter(product, field, selectedValue) {
  if (!selectedValue) {
    return true;
  }

  const selected = normalizeFilterValue(selectedValue);

  return splitFilterValues(product[field])
    .some(value => normalizeFilterValue(value) === selected);
}


function getFilterOptions(dataField, currentFilterKey) {
  const values = new Map();

  allProducts.forEach(product => {

    if (
      activeFilters.category &&
      product.__category !== activeFilters.category
    ) {
      return;
    }

    const filterMap = {
      type: "Tipo",
      material: "Material",
      color: "Color",
      gauge: "Calibre",
      stock: "Stock"
    };

    for (const [key, field] of Object.entries(filterMap)) {
      if (
        key !== currentFilterKey &&
        activeFilters[key] &&
        !productMatchesFilter(product, field, activeFilters[key])
      ) {
        return;
      }
    }

    splitFilterValues(product[dataField]).forEach(value => {
      const key = normalizeFilterValue(value);

      if (key && !values.has(key)) {
        values.set(key, value);
      }
    });
  });

  return [...values.values()].sort((a, b) =>
    String(a).localeCompare(String(b), undefined, {
      numeric: true,
      sensitivity: "base"
    })
  );
}


function populateFilterSelect(id, stateKey, dataField, defaultLabel) {
  const select = document.getElementById(id);
  const previousValue = activeFilters[stateKey];

  select.innerHTML =
    `<option value="">${defaultLabel}</option>`;

  getFilterOptions(dataField, stateKey).forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });

  const stillExists =
    [...select.options].some(
      option =>
        normalizeFilterValue(option.value) ===
        normalizeFilterValue(previousValue)
    );

  if (stillExists) {
    select.value = previousValue;
  } else {
    activeFilters[stateKey] = "";
    select.value = "";
  }
}


function populateCategoryFilter() {
  const select = document.getElementById("filterCategory");
  const previousValue = activeFilters.category;

  select.innerHTML = `<option value="">Todas</option>`;

  Object.keys(catalog)
    .filter(category =>
      Array.isArray(catalog[category]) &&
      catalog[category].length > 0
    )
    .forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      select.appendChild(option);
    });

  if (
    [...select.options].some(option => option.value === previousValue)
  ) {
    select.value = previousValue;
  } else {
    activeFilters.category = "";
    select.value = "";
  }
}


function updateFilterUI() {
  populateCategoryFilter();
  populateFilterSelect("filterType", "type", "Tipo", "Todos");
  populateFilterSelect("filterMaterial", "material", "Material", "Todos");
  populateFilterSelect("filterColor", "color", "Color", "Todos");
  populateFilterSelect("filterGauge", "gauge", "Calibre", "Todos");
  populateFilterSelect("filterStock", "stock", "Stock", "Todos");

  document.getElementById("filterCategory").value =
    activeFilters.category;

  document.getElementById("filterType").value =
    activeFilters.type;

  document.getElementById("filterMaterial").value =
    activeFilters.material;

  document.getElementById("filterColor").value =
    activeFilters.color;

  document.getElementById("filterGauge").value =
    activeFilters.gauge;

  document.getElementById("filterStock").value =
    activeFilters.stock;

  const count =
    Object.values(activeFilters)
      .filter(Boolean)
      .length;

  const badge =
    document.getElementById("filterCount");

  badge.textContent = count;
  badge.style.display = count ? "inline-flex" : "none";

  document.getElementById("activeFilterNote").textContent =
    count
      ? `${count} ${count === 1 ? "filtro activo" : "filtros activos"}`
      : "Sin filtros adicionales";
}


function resetFilters() {
  activeFilters = {
    category: "",
    type: "",
    material: "",
    color: "",
    gauge: "",
    stock: ""
  };

  currentCategory = "Todas";

  updateActiveCategory();
  updateFilterUI();
  renderProducts();
}


function syncCategory(category) {
  currentCategory = category;
  activeFilters.category =
    category === "Todas" ? "" : category;

  updateActiveCategory();
  updateFilterUI();
  renderProducts();
}


function getVisibleProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let products =
    [...allProducts];

  if (showingFavorites) {
    products = products.filter(product => isFavorite(product));
  }


  if (activeFilters.category) {

    products =
      products.filter(
        product =>
          product.__category === activeFilters.category
      );

  }


  if (activeFilters.type) {
    products =
      products.filter(product =>
        productMatchesFilter(product, "Tipo", activeFilters.type)
      );
  }


  if (activeFilters.material) {
    products =
      products.filter(product =>
        productMatchesFilter(product, "Material", activeFilters.material)
      );
  }


  if (activeFilters.color) {
    products =
      products.filter(product =>
        productMatchesFilter(product, "Color", activeFilters.color)
      );
  }


  if (activeFilters.gauge) {
    products =
      products.filter(product =>
        productMatchesFilter(product, "Calibre", activeFilters.gauge)
      );
  }

  if (activeFilters.stock) {
    products =
      products.filter(product =>
        productMatchesFilter(product, "Stock", activeFilters.stock)
      );
  }


  if (search) {

    products =
      products.filter(product => {

        return Object.values(product)
          .join(" ")
          .toLowerCase()
          .includes(search);

      });

  }


  const sort =
    document
      .getElementById("sort")
      .value;


  if (sort === "priceAsc") {

    products.sort(
      (a, b) =>
        normalizePrice(a["Precio"]) -
        normalizePrice(b["Precio"])
    );

  }

  else if (sort === "priceDesc") {

    products.sort(
      (a, b) =>
        normalizePrice(b["Precio"]) -
        normalizePrice(a["Precio"])
    );

  }

  else if (sort === "name") {

    products.sort(
      (a, b) =>
        String(a["Nombre"] || "")
          .localeCompare(
            String(b["Nombre"] || "")
          )
    );

  }


  return products;
}


/* =========================
   FAVORITES
========================= */

function getProductId(product) {
  const code = String(product["Código"] || "").trim();
  if (code) return code;

  return [
    product.__category || product["Categoría"] || "",
    product["Nombre"] || ""
  ].join("::").trim();
}

function saveFavorites() {
  try {
    localStorage.setItem("painshopFavorites", JSON.stringify([...favoriteIds]));
  } catch (error) {}
}

function isFavorite(product) {
  return favoriteIds.has(getProductId(product));
}

function updateFavoriteUI() {
  const count = document.getElementById("favoriteCount");
  const toggle = document.getElementById("favoriteToggle");

  if (count) count.textContent = favoriteIds.size;
  if (toggle) {
    toggle.classList.toggle("active", showingFavorites);
    toggle.querySelector("span:first-child").textContent =
      showingFavorites ? "♥ Favoritos" : "♡ Favoritos";
  }
}

function toggleFavorite(product) {
  const id = getProductId(product);

  if (favoriteIds.has(id)) {
    favoriteIds.delete(id);
  } else {
    favoriteIds.add(id);
  }

  saveFavorites();
  updateFavoriteUI();

  if (productModalProduct && getProductId(productModalProduct) === id) {
    renderProductModal();
  }

  renderProducts();
}

function toggleFavoritesView() {
  showingFavorites = !showingFavorites;
  updateFavoriteUI();
  renderProducts();
}

/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts() {

  const container =
    document.getElementById("products");

  const results =
    document.getElementById("results");


  const products =
    getVisibleProducts();


  results.textContent =
    (showingFavorites ? "Favoritos: " : "") +
    products.length +
    (products.length === 1
      ? " producto"
      : " productos");


  container.innerHTML = "";


  if (!products.length) {

    container.innerHTML =
      `<div class="empty">
        ${showingFavorites ? "Todavía no tienes favoritos." : "No encontramos productos."}
      </div>`;

    return;

  }


  products.forEach(product => {

    container.appendChild(
      createProductCard(product)
    );

  });

}


/* =========================
   PRODUCT CARD
========================= */

function createProductCard(product) {

  const card =
    document.createElement("article");

  const soldOut = isStockSoldOut(product["Stock"]);

  card.className = "card" + (soldOut ? " stock-agotado-card" : "");
  card.style.cursor = "pointer";
  card.addEventListener("click", () => openProductModal(product));


  const photos =
    getPhotos(product);


  const gallery =
    document.createElement("div");

  gallery.className = "gallery";

  if (isFavorite(product)) {
    card.classList.add("favorite-card");
  }

  const favoriteButton = document.createElement("button");
  favoriteButton.type = "button";
  favoriteButton.className = "favorite-button" + (isFavorite(product) ? " active" : "");
  favoriteButton.setAttribute("aria-label", isFavorite(product) ? "Quitar de favoritos" : "Añadir a favoritos");
  favoriteButton.textContent = isFavorite(product) ? "♥" : "♡";
  favoriteButton.onclick = event => {
    event.stopPropagation();
    toggleFavorite(product);
  };
  gallery.appendChild(favoriteButton);


  if (photos.length) {

    const image =
      document.createElement("img");

    image.src = photos[0];

    image.alt =
      product["Nombre"] || "Producto";

    image.loading = "lazy";

    gallery.appendChild(image);


    let photoIndex = 0;


    function updateCardImage() {

      image.src =
        photos[photoIndex];

      if (counter) {

        counter.textContent =
          (photoIndex + 1) +
          " / " +
          photos.length;

      }

    }


    if (photos.length > 1) {

      const prev =
        document.createElement("button");

      prev.className =
        "gallery-arrow left";

      prev.type = "button";

      prev.innerHTML = "‹";


      const next =
        document.createElement("button");

      next.className =
        "gallery-arrow right";

      next.type = "button";

      next.innerHTML = "›";


      const counter =
        document.createElement("div");

      counter.className =
        "gallery-count";

      counter.textContent =
        "1 / " + photos.length;


      prev.onclick = event => {

        event.stopPropagation();

        photoIndex =
          (photoIndex - 1 + photos.length) %
          photos.length;

        updateCardImage();

      };


      next.onclick = event => {

        event.stopPropagation();

        photoIndex =
          (photoIndex + 1) %
          photos.length;

        updateCardImage();

      };


      gallery.appendChild(prev);

      gallery.appendChild(next);

      gallery.appendChild(counter);

    }


    image.onclick = (event) => {
      event.stopPropagation();
      openProductModal(product, photoIndex);
    };


    /* MOBILE SWIPE */

    let touchStartX = 0;
    let touchEndX = 0;


    gallery.addEventListener(
      "touchstart",
      event => {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );


    gallery.addEventListener(
      "touchend",
      event => {

        touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchStartX - touchEndX;


        if (
          photos.length > 1 &&
          Math.abs(difference) > 40
        ) {

          if (difference > 0) {

            photoIndex =
              (photoIndex + 1) %
              photos.length;

          } else {

            photoIndex =
              (photoIndex - 1 + photos.length) %
              photos.length;

          }

          updateCardImage();

        }

      },
      { passive: true }
    );

  }

  else {

    gallery.innerHTML =
      `<div class="no-photo">
        Sin foto
      </div>`;

  }


  card.appendChild(gallery);


  /* CONTENT */

  const content =
    document.createElement("div");

  content.className =
    "card-content";


  const title =
    escapeHTML(
      product["Nombre"] || "Sin nombre"
    );


  const code =
    escapeHTML(
      product["Código"] || ""
    );


  let html = `

    <div class="card-title">
      ${title}
    </div>

    <div class="card-code">
      ${code}
    </div>

    <div class="info">
  `;


  const fields = [

    ["Tipo", "Ideal para"],

    ["Calibre", "Calibre"],

    ["Largo", "Largo"],

    ["Diámetro", "Diámetro"],

    ["mm", "mm"],

    ["Material", "Material"],

    ["Rosca", "Rosca"],

    ["Color", "Color"],

    ["Piedra", "Piedra"]

  ];


  fields.forEach(([field, label]) => {

    const value =
      product[field];


    if (
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ) {

      html += `

        <div class="info-row">

          <span class="info-label">
            ${escapeHTML(label)}
          </span>

          <span class="info-value">
            ${escapeHTML(value)}
          </span>

        </div>

      `;

    }

  });


  html += `</div>`;


  const price =
    displayPrice(product["Precio"]);


  if (price) {

    html += `

      <div class="price">
        ${escapeHTML(price)}
      </div>

    `;

  }


  const stock =
    product["Stock"];


  if (
    stock !== undefined &&
    stock !== null &&
    String(stock).trim() !== ""
  ) {

    html += `

      <div
        class="stock ${getStockClass(stock)}"
      >

        <span class="stock-dot"></span>

        ${escapeHTML(getStockLabel(stock))}

      </div>

    `;

  }


  const codeForWhatsApp =
    product["Código"] || "";

  const nameForWhatsApp =
    product["Nombre"] || "producto";


  const message =
    encodeURIComponent(
      `Hola! Me interesa la joyería "${nameForWhatsApp}"${codeForWhatsApp ? ` (${codeForWhatsApp})` : ""}.`
    );


  html += soldOut
    ? `
      <button
        class="order-btn order-btn-disabled"
        type="button"
        disabled
        onclick="event.stopPropagation()"
      >
        Agotado
      </button>
    `
    : `
      <button
        class="order-btn"
        type="button"
        onclick="event.stopPropagation(); window.open('https://wa.me/593984703739?text=${message}', '_blank')"
      >
        Consultar por WhatsApp
      </button>
    `;


  content.innerHTML =
    html;


  card.appendChild(content);


  return card;

}



/* =========================
   PRODUCT DETAIL MODAL
========================= */

let productModalPhotos = [];
let productModalIndex = 0;
let productModalProduct = null;

function openProductModal(product, startIndex = 0) {
  productModalProduct = product;
  productModalPhotos = getPhotos(product);
  productModalIndex = Math.max(0, Math.min(startIndex || 0, Math.max(productModalPhotos.length - 1, 0)));
  renderProductModal();
  document.getElementById("productModal").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeProductModal() {
  document.getElementById("productModal").classList.remove("active");
  document.body.style.overflow = "";
}

function productModalPrev() {
  if (productModalPhotos.length < 2) return;
  productModalIndex = (productModalIndex - 1 + productModalPhotos.length) % productModalPhotos.length;
  renderProductModalGallery();
}

function productModalNext() {
  if (productModalPhotos.length < 2) return;
  productModalIndex = (productModalIndex + 1) % productModalPhotos.length;
  renderProductModalGallery();
}

function renderProductModal() {
  const p = productModalProduct;
  const info = document.getElementById("productModalInfo");
  const fields = [
    ["Tipo","Ideal para"],["Calibre","Calibre"],["Largo","Largo"],
    ["Diámetro","Diámetro"],["mm","mm"],["Material","Material"],
    ["Rosca","Rosca"],["Color","Color"],["Piedra","Piedra"]
  ];
  let specs = "";
  fields.forEach(([field,label]) => {
    const value=p[field];
    if(value!==undefined && value!==null && String(value).trim()!==""){
      specs += `<div class="product-modal-spec"><span class="product-modal-spec-label">${escapeHTML(label)}</span><span class="product-modal-spec-value">${escapeHTML(value)}</span></div>`;
    }
  });

  const description = p["Descripción"] && String(p["Descripción"]).trim()
    ? `<p class="product-modal-description">${escapeHTML(p["Descripción"])}</p>` : "";
  const price=displayPrice(p["Precio"]);
  const stock=p["Stock"] && String(p["Stock"]).trim() ? String(p["Stock"]) : "";
  const message=encodeURIComponent(`Hola! Me interesa la joyería "${p["Nombre"] || "producto"}"${p["Código"] ? ` (${p["Código"]})` : ""}.`);

  info.innerHTML=`
    <div class="product-modal-category">${escapeHTML(p.__category || p["Categoría"] || "")}</div>
    <h2 class="product-modal-title">${escapeHTML(p["Nombre"] || "Sin nombre")}</h2>
    <div class="product-modal-code">${escapeHTML(p["Código"] || "")}</div>
    <button class="product-modal-favorite ${isFavorite(p) ? "active" : ""}" type="button" onclick="event.stopPropagation();toggleFavorite(productModalProduct)">${isFavorite(p) ? "♥ En favoritos" : "♡ Añadir a favoritos"}</button>
    ${description}
    ${specs ? `<div class="product-modal-specs">${specs}</div>` : ""}
    <div class="product-modal-bottom">
      ${price ? `<div class="product-modal-price">${escapeHTML(price)}</div>` : ""}
      ${stock ? `<div class="product-modal-stock stock ${getStockClass(stock)}"><span class="stock-dot"></span>${escapeHTML(getStockLabel(stock))}</div>` : ""}
      ${isStockSoldOut(stock)
        ? `<button class="product-modal-order order-btn-disabled" type="button" disabled>Agotado</button>`
        : `<button class="product-modal-order" type="button" onclick="event.stopPropagation();window.open('https://wa.me/593984703739?text=${message}','_blank')">Consultar por WhatsApp</button>`}
    </div>`;
  renderProductModalGallery();
}

function renderProductModalGallery() {
  const gallery=document.getElementById("productModalGallery");
  const photos=productModalPhotos;
  if(!photos.length){
    gallery.innerHTML='<div class="no-photo">Sin foto</div>';
    return;
  }
  const multiple=photos.length>1;
  gallery.innerHTML=`
    <img id="productModalImage" src="${escapeHTML(photos[productModalIndex])}" alt="${escapeHTML(productModalProduct["Nombre"]||"Producto")}">
    ${multiple ? `<button class="product-modal-arrow left" type="button" onclick="event.stopPropagation();productModalPrev()">‹</button>
    <button class="product-modal-arrow right" type="button" onclick="event.stopPropagation();productModalNext()">›</button>
    <div class="product-modal-count">${productModalIndex+1} / ${photos.length}</div>
    <div class="product-modal-thumbs">${photos.map((photo,i)=>`<button class="product-modal-thumb ${i===productModalIndex?"active":""}" type="button" onclick="event.stopPropagation();productModalIndex=${i};renderProductModalGallery()"><img src="${escapeHTML(photo)}" alt=""></button>`).join("")}</div>` : ""}`;
  const image=document.getElementById("productModalImage");
  let startX=0;
  image.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX},{passive:true});
  image.addEventListener("touchend",e=>{
    const d=startX-e.changedTouches[0].screenX;
    if(Math.abs(d)>45 && productModalPhotos.length>1) d>0?productModalNext():productModalPrev();
  },{passive:true});
}

document.getElementById("productModalClose").onclick=closeProductModal;
document.getElementById("productModal").addEventListener("click",e=>{if(e.target.id==="productModal")closeProductModal()});
document.addEventListener("keydown",e=>{
  const modal=document.getElementById("productModal");
  if(!modal.classList.contains("active"))return;
  if(e.key==="Escape")closeProductModal();
  if(e.key==="ArrowLeft")productModalPrev();
  if(e.key==="ArrowRight")productModalNext();
});


/* =========================
   LIGHTBOX
========================= */

function openLightbox(
  photos,
  index,
  title
) {

  lightboxPhotos =
    photos || [];

  lightboxIndex =
    index || 0;


  if (!lightboxPhotos.length) {
    return;
  }


  const lightbox =
    document.getElementById("lightbox");


  lightbox.classList.add("active");

  document.body.style.overflow =
    "hidden";


  showLightboxPhoto(title);

}


function showLightboxPhoto(title) {

  const image =
    document.getElementById("lightboxImage");


  image.src =
    lightboxPhotos[lightboxIndex];


  image.alt =
    title || "Producto";


  document.getElementById(
    "lightboxCount"
  ).textContent =
    (lightboxIndex + 1) +
    " / " +
    lightboxPhotos.length;


  const prev =
    document.getElementById(
      "lightboxPrev"
    );

  const next =
    document.getElementById(
      "lightboxNext"
    );


  const multiple =
    lightboxPhotos.length > 1;


  prev.style.display =
    multiple ? "block" : "none";

  next.style.display =
    multiple ? "block" : "none";

}


function closeLightbox() {

  document
    .getElementById("lightbox")
    .classList.remove("active");


  document.body.style.overflow =
    "";

}


function lightboxPrev() {

  if (!lightboxPhotos.length) {
    return;
  }


  lightboxIndex =
    (lightboxIndex - 1 + lightboxPhotos.length) %
    lightboxPhotos.length;


  showLightboxPhoto();

}


function lightboxNext() {

  if (!lightboxPhotos.length) {
    return;
  }


  lightboxIndex =
    (lightboxIndex + 1) %
    lightboxPhotos.length;


  showLightboxPhoto();

}


/* BUTTONS */

document
  .getElementById("lightboxClose")
  .onclick =
  closeLightbox;


document
  .getElementById("lightboxPrev")
  .onclick =
  lightboxPrev;


document
  .getElementById("lightboxNext")
  .onclick =
  lightboxNext;


/* CLICK OUTSIDE */

document
  .getElementById("lightbox")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "lightbox"
      ) {

        closeLightbox();

      }

    }
  );


/* KEYBOARD */

document.addEventListener(
  "keydown",
  event => {

    const isOpen =
      document
        .getElementById("lightbox")
        .classList
        .contains("active");


    if (!isOpen) {
      return;
    }


    if (event.key === "Escape") {
      closeLightbox();
    }


    if (event.key === "ArrowLeft") {
      lightboxPrev();
    }


    if (event.key === "ArrowRight") {
      lightboxNext();
    }

  }
);


/* LIGHTBOX MOBILE SWIPE */

let lightboxTouchStartX = 0;
let lightboxTouchEndX = 0;


document
  .getElementById("lightbox")
  .addEventListener(
    "touchstart",
    event => {

      lightboxTouchStartX =
        event.changedTouches[0].screenX;

    },
    { passive: true }
  );


document
  .getElementById("lightbox")
  .addEventListener(
    "touchend",
    event => {

      lightboxTouchEndX =
        event.changedTouches[0].screenX;


      const difference =
        lightboxTouchStartX -
        lightboxTouchEndX;


      if (
        Math.abs(difference) > 50 &&
        lightboxPhotos.length > 1
      ) {

        if (difference > 0) {
          lightboxNext();
        } else {
          lightboxPrev();
        }

      }

    },
    { passive: true }
  );


/* SEARCH + SORT */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );


document
  .getElementById("sort")
  .addEventListener(
    "change",
    renderProducts
  );



/* FILTER CONTROLS */

document
  .getElementById("filterToggle")
  .addEventListener("click", () => {
    document
      .getElementById("filtersPanel")
      .classList.toggle("active");
  });


[
  ["filterCategory", "category"],
  ["filterType", "type"],
  ["filterMaterial", "material"],
  ["filterColor", "color"],
  ["filterGauge", "gauge"],
  ["filterStock", "stock"]
].forEach(([id, field]) => {

  document
    .getElementById(id)
    .addEventListener("change", event => {

      activeFilters[field] =
        event.target.value;

      if (field === "category") {
        currentCategory =
          event.target.value || "Todas";

        updateActiveCategory();
      }

      updateFilterUI();
      renderProducts();

    });

});


document
  .getElementById("favoriteToggle")
  .addEventListener("click", toggleFavoritesView);

updateFavoriteUI();

document
  .getElementById("clearFilters")
  .addEventListener("click", resetFilters);


/* START */

loadCatalog();

</script>
