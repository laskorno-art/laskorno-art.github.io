<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PainShop — Jewelry</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0d0f;
  color: #f1f1f1;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 24px 6%;
  border-bottom: 1px solid #242428;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo span {
  color: #888;
  font-weight: 400;
}

.search {
  width: 320px;
  max-width: 100%;
  background: #17171a;
  border: 1px solid #2c2c31;
  border-radius: 10px;
  padding: 12px 15px;
  color: white;
  outline: none;
}

main {
  width: 88%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 45px 0;
}

.intro {
  margin-bottom: 35px;
}

.intro h1 {
  font-size: 38px;
  margin: 0 0 10px;
}

.intro p {
  color: #999;
  margin: 0;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 30px;
}

.category-btn {
  background: #17171a;
  border: 1px solid #2c2c31;
  color: #aaa;
  padding: 9px 15px;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s;
}

.category-btn:hover,
.category-btn.active {
  background: #f1f1f1;
  color: #111;
  border-color: #f1f1f1;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

.results {
  color: #777;
  font-size: 14px;
}

.sort {
  background: #17171a;
  border: 1px solid #2c2c31;
  color: #ddd;
  padding: 10px;
  border-radius: 8px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 18px;
}

.card {
  background: #141417;
  border: 1px solid #242428;
  border-radius: 14px;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #3b3b40;
}

/* GALLERY */

.gallery {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #101012;
  overflow: hidden;
}

.gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
}

.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.55);
  color: white;
  cursor: pointer;
  z-index: 3;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
}

.gallery:hover .gallery-arrow {
  opacity: 1;
}

.gallery-arrow:hover {
  background: rgba(255,255,255,0.18);
}

.gallery-arrow.left {
  left: 10px;
}

.gallery-arrow.right {
  right: 10px;
}

.gallery-count {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 999px;
  z-index: 3;
}

.no-photo {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 13px;
}

.card-content {
  padding: 17px;
}

.card-title {
  font-size: 17px;
  margin-bottom: 8px;
}

.card-code {
  color: #666;
  font-size: 12px;
  margin-bottom: 12px;
}

.info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
}

.info-label {
  color: #666;
}

.info-value {
  color: #bbb;
  text-align: right;
}

.price {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.stock {
  margin-top: 8px;
  font-size: 12px;
  color: #888;
}

.stock-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  margin-right: 5px;
}

.order-btn {
  width: 100%;
  margin-top: 15px;
  padding: 11px;
  border-radius: 8px;
  border: none;
  background: #f1f1f1;
  color: #111;
  font-weight: 600;
  cursor: pointer;
}

.order-btn:hover {
  background: #ddd;
}

.empty {
  color: #777;
  padding: 50px 0;
  text-align: center;
}

footer {
  margin-top: 60px;
  padding: 40px 6%;
  border-top: 1px solid #242428;
  color: #777;
  line-height: 1.7;
}

footer strong {
  color: #ddd;
}

/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.lightbox.active {
  display: flex;
}

.lightbox-content {
  position: relative;
  width: min(1000px, 95vw);
  height: min(90vh, 900px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-image {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  user-select: none;
}

.lightbox-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid #444;
  background: #17171a;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.lightbox-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid #444;
  background: rgba(20,20,23,0.9);
  color: white;
  cursor: pointer;
  font-size: 25px;
}

.lightbox-arrow.left {
  left: 0;
}

.lightbox-arrow.right {
  right: 0;
}

.lightbox-count {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  color: #aaa;
  font-size: 13px;
}

@media (max-width: 600px) {

  header {
    flex-direction: column;
    align-items: stretch;
  }

  .search {
    width: 100%;
  }

  main {
    width: 92%;
    padding-top: 30px;
  }

  .intro h1 {
    font-size: 30px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .card-content {
    padding: 12px;
  }

  .card-title {
    font-size: 15px;
  }

  .info-row {
    font-size: 11px;
  }

  .price {
    font-size: 17px;
  }

  .gallery-arrow {
    opacity: 1;
    width: 30px;
    height: 30px;
    font-size: 17px;
  }

  .lightbox {
    padding: 10px;
  }

  .lightbox-image {
    max-width: 95%;
    max-height: 80%;
  }

  .lightbox-arrow {
    width: 38px;
    height: 38px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    PainShop <span>/ Jewelry</span>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Buscar joyería..."
  >
</header>

<main>

  <section class="intro">
    <h1>Joyería para piercing</h1>
    <p>Explora nuestro catálogo y encuentra tu próxima pieza.</p>
  </section>

  <div id="categories" class="categories"></div>

  <div class="controls">
    <div id="results" class="results"></div>

    <select id="sort" class="sort">
      <option value="default">Ordenar</option>
      <option value="priceAsc">Precio: menor a mayor</option>
      <option value="priceDesc">Precio: mayor a menor</option>
      <option value="name">Nombre</option>
    </select>
  </div>

  <div id="products" class="products"></div>

</main>

<footer>
  <strong>PainShop</strong><br>
  Joyería para piercing<br><br>

  WhatsApp: +593 98 470 3739<br>
  Ecuador, Quito — Reina Victoria Y La Pinta<br><br>

  Instagram · TikTok · Feedback
</footer>


<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">

  <div class="lightbox-content">

    <button
      id="lightboxClose"
      class="lightbox-close"
      type="button"
    >×</button>

    <button
      id="lightboxPrev"
      class="lightbox-arrow left"
      type="button"
    >‹</button>

    <img
      id="lightboxImage"
      class="lightbox-image"
      alt=""
    >

    <button
      id="lightboxNext"
      class="lightbox-arrow right"
      type="button"
    >›</button>

    <div
      id="lightboxCount"
      class="lightbox-count"
    ></div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzmvI1adtX-AmCKToQl-nB5r2Irs48BbMGk2VMvQbb1zq2VwyuNlL6_hmJD7xQsNn2u/exec";


let catalog = {};
let allProducts = [];
let currentCategory = "Todas";

let lightboxPhotos = [];
let lightboxIndex = 0;


/* =========================
   GOOGLE DRIVE PHOTOS
========================= */

function convertPhotoUrl(url) {

  if (!url) {
    return null;
  }

  const driveMatch =
    String(url).match(
      /drive\.google\.com\/file\/d\/([^/]+)/
    );

  if (driveMatch) {

    const fileId = driveMatch[1];

    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(fileId) +
      "&sz=w1200"
    );
  }

  return String(url).trim();
}


function getPhotos(product) {

  const value = product["Fotos"];

  if (!value) {
    return [];
  }

  return String(value)
    .split(",")
    .map(x => x.trim())
    .filter(Boolean)
    .map(convertPhotoUrl)
    .filter(Boolean);
}


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function normalizePrice(value) {

  if (value === null || value === undefined) {
    return 0;
  }

  const cleaned =
    String(value)
      .replace("$", "")
      .replace(",", ".")
      .trim();

  const number = parseFloat(cleaned);

  return isNaN(number) ? 0 : number;
}


function displayPrice(value) {

  const number = normalizePrice(value);

  if (!number) {
    return "";
  }

  return "$" + number;
}


function getStockColor(stock) {

  const value =
    String(stock || "").toLowerCase();

  if (value.includes("disponible")) {
    return "#aaa";
  }

  if (value.includes("agotado")) {
    return "#555";
  }

  return "#888";
}


/* =========================
   LOAD CATALOG
========================= */

function loadCatalog() {

  const callbackName =
    "painshopCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  const timeout =
    setTimeout(() => {

      script.remove();

      showError();

    }, 10000);


  window[callbackName] = function(data) {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    catalog = data || {};

    prepareProducts();

  };


  script.onerror = function() {

    clearTimeout(timeout);

    delete window[callbackName];

    script.remove();

    showError();

  };


  script.src =
    API_URL +
    "?callback=" +
    callbackName +
    "&_=" +
    Date.now();

  document.body.appendChild(script);
}


function showError() {

  document.getElementById("products").innerHTML =
    `<div class="empty">
      No se pudo cargar el catálogo.
      <br>
      Intenta actualizar la página.
    </div>`;
}


/* =========================
   PREPARE PRODUCTS
========================= */

function prepareProducts() {

  allProducts = [];

  Object.keys(catalog).forEach(category => {

    const products =
      Array.isArray(catalog[category])
        ? catalog[category]
        : [];

    products.forEach(product => {

      product.__category = category;

      allProducts.push(product);

    });

  });

  renderCategories();

  renderProducts();

}


/* =========================
   CATEGORIES
========================= */

function renderCategories() {

  const container =
    document.getElementById("categories");

  container.innerHTML = "";

  const categories =
    Object.keys(catalog)
      .filter(category =>
        Array.isArray(catalog[category]) &&
        catalog[category].length > 0
      );


  const allButton =
    document.createElement("button");

  allButton.className =
    "category-btn active";

  allButton.textContent =
    "Todas";

  allButton.onclick = () => {

    currentCategory = "Todas";

    updateActiveCategory();

    renderProducts();

  };

  container.appendChild(allButton);


  categories.forEach(category => {

    const button =
      document.createElement("button");

    button.className =
      "category-btn";

    button.textContent =
      category;

    button.onclick = () => {

      currentCategory = category;

      updateActiveCategory();

      renderProducts();

    };

    container.appendChild(button);

  });

}


function updateActiveCategory() {

  document
    .querySelectorAll(".category-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.textContent === currentCategory
      );

    });

}


/* =========================
   FILTER + SORT
========================= */

function getVisibleProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let products =
    [...allProducts];


  if (currentCategory !== "Todas") {

    products =
      products.filter(
        product =>
          product.__category === currentCategory
      );

  }


  if (search) {

    products =
      products.filter(product => {

        return Object.values(product)
          .join(" ")
          .toLowerCase()
          .includes(search);

      });

  }


  const sort =
    document
      .getElementById("sort")
      .value;


  if (sort === "priceAsc") {

    products.sort(
      (a, b) =>
        normalizePrice(a["Precio"]) -
        normalizePrice(b["Precio"])
    );

  }

  else if (sort === "priceDesc") {

    products.sort(
      (a, b) =>
        normalizePrice(b["Precio"]) -
        normalizePrice(a["Precio"])
    );

  }

  else if (sort === "name") {

    products.sort(
      (a, b) =>
        String(a["Nombre"] || "")
          .localeCompare(
            String(b["Nombre"] || "")
          )
    );

  }


  return products;
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts() {

  const container =
    document.getElementById("products");

  const results =
    document.getElementById("results");


  const products =
    getVisibleProducts();


  results.textContent =
    products.length +
    (products.length === 1
      ? " producto"
      : " productos");


  container.innerHTML = "";


  if (!products.length) {

    container.innerHTML =
      `<div class="empty">
        No encontramos productos.
      </div>`;

    return;

  }


  products.forEach(product => {

    container.appendChild(
      createProductCard(product)
    );

  });

}


/* =========================
   PRODUCT CARD
========================= */

function createProductCard(product) {

  const card =
    document.createElement("article");

  card.className = "card";


  const photos =
    getPhotos(product);


  const gallery =
    document.createElement("div");

  gallery.className = "gallery";


  if (photos.length) {

    const image =
      document.createElement("img");

    image.src = photos[0];

    image.alt =
      product["Nombre"] || "Producto";

    image.loading = "lazy";

    gallery.appendChild(image);


    let photoIndex = 0;


    function updateCardImage() {

      image.src =
        photos[photoIndex];

      if (counter) {

        counter.textContent =
          (photoIndex + 1) +
          " / " +
          photos.length;

      }

    }


    if (photos.length > 1) {

      const prev =
        document.createElement("button");

      prev.className =
        "gallery-arrow left";

      prev.type = "button";

      prev.innerHTML = "‹";


      const next =
        document.createElement("button");

      next.className =
        "gallery-arrow right";

      next.type = "button";

      next.innerHTML = "›";


      const counter =
        document.createElement("div");

      counter.className =
        "gallery-count";

      counter.textContent =
        "1 / " + photos.length;


      prev.onclick = event => {

        event.stopPropagation();

        photoIndex =
          (photoIndex - 1 + photos.length) %
          photos.length;

        updateCardImage();

      };


      next.onclick = event => {

        event.stopPropagation();

        photoIndex =
          (photoIndex + 1) %
          photos.length;

        updateCardImage();

      };


      gallery.appendChild(prev);

      gallery.appendChild(next);

      gallery.appendChild(counter);

    }


    image.onclick = () => {

      openLightbox(
        photos,
        photoIndex,
        product["Nombre"] || ""
      );

    };


    /* MOBILE SWIPE */

    let touchStartX = 0;
    let touchEndX = 0;


    gallery.addEventListener(
      "touchstart",
      event => {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      { passive: true }
    );


    gallery.addEventListener(
      "touchend",
      event => {

        touchEndX =
          event.changedTouches[0].screenX;


        const difference =
          touchStartX - touchEndX;


        if (
          photos.length > 1 &&
          Math.abs(difference) > 40
        ) {

          if (difference > 0) {

            photoIndex =
              (photoIndex + 1) %
              photos.length;

          } else {

            photoIndex =
              (photoIndex - 1 + photos.length) %
              photos.length;

          }

          updateCardImage();

        }

      },
      { passive: true }
    );

  }

  else {

    gallery.innerHTML =
      `<div class="no-photo">
        Sin foto
      </div>`;

  }


  card.appendChild(gallery);


  /* CONTENT */

  const content =
    document.createElement("div");

  content.className =
    "card-content";


  const title =
    escapeHTML(
      product["Nombre"] || "Sin nombre"
    );


  const code =
    escapeHTML(
      product["Código"] || ""
    );


  let html = `

    <div class="card-title">
      ${title}
    </div>

    <div class="card-code">
      ${code}
    </div>

    <div class="info">
  `;


  const fields = [

    ["Tipo", "Ideal para"],

    ["Calibre", "Calibre"],

    ["Largo", "Largo"],

    ["Diámetro", "Diámetro"],

    ["mm", "mm"],

    ["Material", "Material"],

    ["Rosca", "Rosca"],

    ["Color", "Color"],

    ["Piedra", "Piedra"]

  ];


  fields.forEach(([field, label]) => {

    const value =
      product[field];


    if (
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ) {

      html += `

        <div class="info-row">

          <span class="info-label">
            ${escapeHTML(label)}
          </span>

          <span class="info-value">
            ${escapeHTML(value)}
          </span>

        </div>

      `;

    }

  });


  html += `</div>`;


  const price =
    displayPrice(product["Precio"]);


  if (price) {

    html += `

      <div class="price">
        ${escapeHTML(price)}
      </div>

    `;

  }


  const stock =
    product["Stock"];


  if (
    stock !== undefined &&
    stock !== null &&
    String(stock).trim() !== ""
  ) {

    html += `

      <div
        class="stock"
        style="color:${getStockColor(stock)}"
      >

        <span class="stock-dot"></span>

        ${escapeHTML(stock)}

      </div>

    `;

  }


  const codeForWhatsApp =
    product["Código"] || "";

  const nameForWhatsApp =
    product["Nombre"] || "producto";


  const message =
    encodeURIComponent(
      `Hola! Me interesa la joyería "${nameForWhatsApp}"${codeForWhatsApp ? ` (${codeForWhatsApp})` : ""}.`
    );


  html += `

    <button
      class="order-btn"
      type="button"
      onclick="window.open('https://wa.me/593984703739?text=${message}', '_blank')"
    >
      Consultar por WhatsApp
    </button>

  `;


  content.innerHTML =
    html;


  card.appendChild(content);


  return card;

}


/* =========================
   LIGHTBOX
========================= */

function openLightbox(
  photos,
  index,
  title
) {

  lightboxPhotos =
    photos || [];

  lightboxIndex =
    index || 0;


  if (!lightboxPhotos.length) {
    return;
  }


  const lightbox =
    document.getElementById("lightbox");


  lightbox.classList.add("active");

  document.body.style.overflow =
    "hidden";


  showLightboxPhoto(title);

}


function showLightboxPhoto(title) {

  const image =
    document.getElementById("lightboxImage");


  image.src =
    lightboxPhotos[lightboxIndex];


  image.alt =
    title || "Producto";


  document.getElementById(
    "lightboxCount"
  ).textContent =
    (lightboxIndex + 1) +
    " / " +
    lightboxPhotos.length;


  const prev =
    document.getElementById(
      "lightboxPrev"
    );

  const next =
    document.getElementById(
      "lightboxNext"
    );


  const multiple =
    lightboxPhotos.length > 1;


  prev.style.display =
    multiple ? "block" : "none";

  next.style.display =
    multiple ? "block" : "none";

}


function closeLightbox() {

  document
    .getElementById("lightbox")
    .classList.remove("active");


  document.body.style.overflow =
    "";

}


function lightboxPrev() {

  if (!lightboxPhotos.length) {
    return;
  }


  lightboxIndex =
    (lightboxIndex - 1 + lightboxPhotos.length) %
    lightboxPhotos.length;


  showLightboxPhoto();

}


function lightboxNext() {

  if (!lightboxPhotos.length) {
    return;
  }


  lightboxIndex =
    (lightboxIndex + 1) %
    lightboxPhotos.length;


  showLightboxPhoto();

}


/* BUTTONS */

document
  .getElementById("lightboxClose")
  .onclick =
  closeLightbox;


document
  .getElementById("lightboxPrev")
  .onclick =
  lightboxPrev;


document
  .getElementById("lightboxNext")
  .onclick =
  lightboxNext;


/* CLICK OUTSIDE */

document
  .getElementById("lightbox")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "lightbox"
      ) {

        closeLightbox();

      }

    }
  );


/* KEYBOARD */

document.addEventListener(
  "keydown",
  event => {

    const isOpen =
      document
        .getElementById("lightbox")
        .classList
        .contains("active");


    if (!isOpen) {
      return;
    }


    if (event.key === "Escape") {
      closeLightbox();
    }


    if (event.key === "ArrowLeft") {
      lightboxPrev();
    }


    if (event.key === "ArrowRight") {
      lightboxNext();
    }

  }
);


/* LIGHTBOX MOBILE SWIPE */

let lightboxTouchStartX = 0;
let lightboxTouchEndX = 0;


document
  .getElementById("lightbox")
  .addEventListener(
    "touchstart",
    event => {

      lightboxTouchStartX =
        event.changedTouches[0].screenX;

    },
    { passive: true }
  );


document
  .getElementById("lightbox")
  .addEventListener(
    "touchend",
    event => {

      lightboxTouchEndX =
        event.changedTouches[0].screenX;


      const difference =
        lightboxTouchStartX -
        lightboxTouchEndX;


      if (
        Math.abs(difference) > 50 &&
        lightboxPhotos.length > 1
      ) {

        if (difference > 0) {
          lightboxNext();
        } else {
          lightboxPrev();
        }

      }

    },
    { passive: true }
  );


/* SEARCH + SORT */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );


document
  .getElementById("sort")
  .addEventListener(
    "change",
    renderProducts
  );


/* START */

loadCatalog();

</script>

</body>
</html>
